name: Build APK

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:
    inputs:
      build_type:
        description: Tipo de build
        required: true
        default: release
        type: choice
        options: [debug, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/dependencies/vcpkg
  VCPKG_FORCE_DOWNLOADED_BINARIES: true
  LOG_DIR: ${{ github.workspace }}/ci-logs

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare log directory
        run: mkdir -p "$LOG_DIR"

      - name: Install system dependencies
        run: |
          set -o pipefail
          { sudo apt-get update -qq; \
            sudo apt-get install -y gettext mono-complete; } 2>&1 | tee -a "$LOG_DIR/00-system.log"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Los runners de GitHub ya traen un SDK de Android preinstalado, asi que en
      # lugar de depender de una action de terceros, usamos el que ya esta ahi.
      - name: Set up Android SDK
        run: |
          set -o pipefail
          { echo "ANDROID_HOME=$ANDROID_HOME"; \
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"; \
            ls -la "$ANDROID_HOME"; \
            ls -la "$ANDROID_HOME/cmdline-tools"/*/bin; } 2>&1 | tee -a "$LOG_DIR/01-sdk-deteccion.log"

      - name: Install Android SDK packages
        run: |
          set -o pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "Usando sdkmanager: $SDKMANAGER"
          { yes | "$SDKMANAGER" --licenses; } 2>&1 | tee -a "$LOG_DIR/02-licencias.log" || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.30.5" \
            "ndk;29.0.14206865" 2>&1 | tee -a "$LOG_DIR/03-sdk-install.log"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Uncompile message catalogs
        run: |
          set -o pipefail
          { for mo_file in bin/resources/*/cemu.mo
            do
              echo "$mo_file"
              language_code=$(basename $(dirname "$mo_file"))
              po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
              mkdir -p $(dirname "$po_file")
              msgunfmt "$mo_file" -o "$po_file" || echo "Failed to uncompile message catalog from $mo_file"
            done; } 2>&1 | tee -a "$LOG_DIR/04-translations.log"

      - name: Set up vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Cemu
        working-directory: ./src/android
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -o pipefail
          ./gradlew "assemble${BUILD_TYPE^}" \
            --stacktrace \
            2>&1 | tee -a "$LOG_DIR/05-build.log"

      # El log de compilacion solo se puede bajar del artifact con
      # autenticacion, asi que cuando el build falla no habia forma de saber
      # que habia pasado. Se vuelca lo importante en el resumen del run, y
      # ademas cada error se emite como anotacion, que si se puede leer sin
      # token a traves de la API de checks.
      - name: Resumen del log de compilacion
        if: always()
        run: |
          {
            echo "### Errores de compilacion"
            echo '```'
            grep -nE "error:|FAILED:|ninja: build stopped|CMake Error" "$LOG_DIR/05-build.log" 2>/dev/null | head -40 || echo "sin errores de compilacion"
            echo '```'
            echo "### Ultimas 60 lineas de 05-build.log"
            echo '```'
            tail -n 60 "$LOG_DIR/05-build.log" 2>/dev/null || echo "sin log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE "error:|FAILED:" "$LOG_DIR/05-build.log" 2>/dev/null | head -25 | while IFS= read -r err; do
            err=$(printf '%s' "$err" | tr -d '\000' | head -c 600)
            echo "::error title=Fallo de compilacion::${err}"
          done
          echo "::error title=Fallo de compilacion::fin de los errores, revisar el resumen del run"

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find src/android/app/build/outputs/apk -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \; || true
          ls -la "$GITHUB_WORKSPACE/apk-out/"

      - name: Merge logs
        if: always()
        run: |
          for f in "$LOG_DIR"/*.log; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "all.log" ] && continue
            {
              echo "===== $(basename "$f") ====="
              cat "$f"
              echo
            } >> "$LOG_DIR/all.log"
          done
          {
            echo "### Build de Cemu Android - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "### Commit: ${{ github.sha }}"
          } | cat - "$LOG_DIR/all.log" > "$LOG_DIR/all.tmp" && mv "$LOG_DIR/all.tmp" "$LOG_DIR/all.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ci-logs/all.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-apk-${{ inputs.build_type || 'release' }}
          path: apk-out/*.apk
          if-no-files-found: warn
          retention-days: 30
