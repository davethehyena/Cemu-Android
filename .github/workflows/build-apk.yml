name: Build APK

on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:
    inputs:
      build_type:
        description: Tipo de build
        required: true
        default: debug
        type: choice
        options: [debug, release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/dependencies/vcpkg
  VCPKG_FORCE_DOWNLOADED_BINARIES: true

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext mono-complete

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.30.5" \
            "ndk;29.0.14206865"
          sdkmanager --licenses <<< "y" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Uncompile message catalogs
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            echo "$mo_file"
            language_code=$(basename $(dirname "$mo_file"))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname "$po_file")
            msgunfmt "$mo_file" -o "$po_file" || echo "Failed to uncompile message catalog from $mo_file"
          done

      - name: Set up vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Cemu
        working-directory: ./src/android
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          set -o pipefail
          ./gradlew "assemble${BUILD_TYPE^}" \
            --stacktrace \
            2>&1 | tee "$GITHUB_WORKSPACE/build-${BUILD_TYPE}.log"

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find src/android/app/build/outputs/apk -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \; || true
          ls -la "$GITHUB_WORKSPACE/apk-out/"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build-*.log
            src/android/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cemu-apk-${{ inputs.build_type || 'debug' }}
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30
